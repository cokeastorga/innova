<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60" fill="none">
  <!-- Nissan Official Monogram Emblem Centered -->
  <g transform="translate(10, 3)">
    <!-- Top Arc -->
    <path d="M 10 27 A 20 20 0 0 1 50 27" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <!-- Bottom Arc -->
    <path d="M 10 27 A 20 20 0 0 0 50 27" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <!-- Horizontal Crossbar -->
    <rect x="2" y="23" width="56" height="8" rx="2" fill="#111827" />
    <text x="30" y="29.5" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="7" letter-spacing="1.5" fill="#FFFFFF">NISSAN</text>
  </g>
</svg>
