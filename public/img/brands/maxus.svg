<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60" fill="none">
  <defs>
    <linearGradient id="maxusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="maxusAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <!-- Maxus 3-triangles pyramid emblem centered -->
  <g transform="translate(10, 6)">
    <!-- Top Left Triangle -->
    <polygon points="20,4 37,32 3,32" fill="url(#maxusGrad)" stroke="#111827" stroke-width="1.5" />
    <!-- Top Right Triangle -->
    <polygon points="40,4 57,32 23,32" fill="url(#maxusGrad)" stroke="#111827" stroke-width="1.5" />
    <!-- Bottom Inverted Triangle -->
    <polygon points="22,34 38,8 54,34" fill="url(#maxusAccent)" stroke="#EA580C" stroke-width="1.5" />
  </g>
</svg>
